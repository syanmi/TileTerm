name: Release

# Pushing a version tag (v0.2.0, v1.0.0-beta.1, ...) builds the portable zip and the installer with
# scripts/build_release.ps1 and publishes them as a GitHub Release. Run it by hand ("Run workflow")
# to build the packages without publishing anything; they are then available as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload its files

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # For a tag build, -Tag makes the script fail unless the tag equals "v" + <Version> in the csproj.
      - name: Build packages
        shell: pwsh
        run: ./scripts/build_release.ps1 -Tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileTerm-packages
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/SHA256SUMS.txt

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          # A tag with a "-" (v1.0.0-beta.1) is a pre-release; a plain v0.x.y is a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
