name: Release

# Pushing a version tag (v0.2.0, v1.0.0-beta.1, ...) builds the Velopack packages with scripts/build_release.ps1
# and publishes them as a GitHub Release: the installer, the portable zip, and the update packages + feed that
# the app's updater reads. Start it with scripts/release.ps1, which sets the version, commits, tags and pushes.
# "Run workflow" (workflow_dispatch) builds the packages without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release notes are built from the commits since the previous tag

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # For a tag build, -Tag makes the script fail unless the tag equals "v" + <Version> in the csproj.
      # GITHUB_TOKEN lets it download the previous release, which the delta packages are computed against.
      - name: Build packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build_release.ps1 -Tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileTerm-packages
          path: artifacts/release/

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.exe
            artifacts/release/*.zip
            artifacts/release/*.nupkg
            artifacts/release/*.json
            artifacts/release/RELEASES
            artifacts/release/SHA256SUMS.txt
          body_path: artifacts/release/release-notes.md
          # A tag with a "-" (v1.0.0-beta.1) is a pre-release; a plain v0.x.y is a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
